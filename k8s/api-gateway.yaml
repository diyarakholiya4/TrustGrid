---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: trustgrid
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: trustgrid-api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: trustgrid-config
                  key: AUTH_SERVICE_URL
            - name: CERT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: trustgrid-config
                  key: CERT_SERVICE_URL
            - name: VERIFY_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: trustgrid-config
                  key: VERIFY_SERVICE_URL
            - name: REVOKE_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: trustgrid-config
                  key: REVOKE_SERVICE_URL
            - name: AUDIT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: trustgrid-config
                  key: AUDIT_SERVICE_URL
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
---
# NodePort Service — exposes API Gateway outside the Minikube cluster
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: trustgrid
  labels:
    app: api-gateway
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - port: 3000
      targetPort: 3000
