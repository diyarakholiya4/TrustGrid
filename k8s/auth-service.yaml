---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: trustgrid
  labels:
    app: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: trustgrid-auth-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: DEMO_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: trustgrid-config
                  key: DEMO_USERNAME
            - name: DEMO_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: trustgrid-config
                  key: DEMO_PASSWORD
          readinessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: trustgrid
  labels:
    app: auth-service
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
    - port: 3001
      targetPort: 3001
