---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: revocation-service
  namespace: trustgrid
  labels:
    app: revocation-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: revocation-service
  template:
    metadata:
      labels:
        app: revocation-service
    spec:
      containers:
        - name: revocation-service
          image: trustgrid-revocation-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3004
          env:
            - name: MONGO_URI
              valueFrom:
                configMapKeyRef:
                  name: trustgrid-config
                  key: MONGO_URI
          readinessProbe:
            httpGet:
              path: /
              port: 3004
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 3004
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: revocation-service
  namespace: trustgrid
  labels:
    app: revocation-service
spec:
  type: ClusterIP
  selector:
    app: revocation-service
  ports:
    - port: 3004
      targetPort: 3004
