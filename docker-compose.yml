services:
  mongodb:
    image: mongo:8
    container_name: trustgrid-mongodb
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  auth-service:
    build: ./auth-service
    container_name: trustgrid-auth
    ports:
      - "3001:3001"
    environment:
      - DEMO_USERNAME=${DEMO_USERNAME:-admin}
      - DEMO_PASSWORD=${DEMO_PASSWORD:-admin123}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  certificate-service:
    build: ./certificate-service
    container_name: trustgrid-certificate
    ports:
      - "3002:3002"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/trustgrid
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  verification-service:
    build: ./verification-service
    container_name: trustgrid-verification
    ports:
      - "3003:3003"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/trustgrid
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  revocation-service:
    build: ./revocation-service
    container_name: trustgrid-revocation
    ports:
      - "3004:3004"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/trustgrid
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3004/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  audit-service:
    build: ./audit-service
    container_name: trustgrid-audit
    ports:
      - "3005:3005"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/trustgrid
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3005/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api-gateway:
    build: ./api-gateway
    container_name: trustgrid-gateway
    ports:
      - "3000:3000"
    environment:
      - AUTH_SERVICE_URL=http://auth-service:3001
      - CERT_SERVICE_URL=http://certificate-service:3002
      - VERIFY_SERVICE_URL=http://verification-service:3003
      - REVOKE_SERVICE_URL=http://revocation-service:3004
      - AUDIT_SERVICE_URL=http://audit-service:3005
    depends_on:
      auth-service:
        condition: service_healthy
      certificate-service:
        condition: service_healthy
      verification-service:
        condition: service_healthy
      revocation-service:
        condition: service_healthy
      audit-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongo-data: